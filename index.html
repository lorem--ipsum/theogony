<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Théogonie · Arbre des dieux grecs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Vieux Safari (iOS < 14) : pas de BigInt. React Flow ne s'en sert que comme compteur,
      // un simple Number suffit.
      if (typeof BigInt === 'undefined') window.BigInt = function (v) { return Number(v) }
      // Safari < 14.1 ignore « gap » en flexbox : on le détecte pour activer des marges de repli.
      ;(function () {
        var d = document.createElement('div')
        d.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden'
        d.appendChild(document.createElement('div'))
        d.appendChild(document.createElement('div'))
        document.documentElement.appendChild(d)
        if (d.scrollHeight !== 1) document.documentElement.className += ' no-flexgap'
        document.documentElement.removeChild(d)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
